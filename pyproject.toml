[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aprendizaje-chtb-cbmm"
version = "0.1.0"
description = "Asistente inteligente ERP para el Cuerpo de Bomberos Municipal de Machala"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
    "PyYAML",
    "pydantic",
    "playwright",
    "fastapi",
    "uvicorn[standard]",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "neo4j>=6.0,<7",
    "chromadb>=1.5,<2",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["erp_assistant*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "postgresql: pruebas de integración que requieren TEST_DATABASE_URL",
    "neo4j: pruebas de integración que requieren TEST_NEO4J_URI",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []
