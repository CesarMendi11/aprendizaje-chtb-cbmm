services:
  postgres:
    image: postgres:17-alpine
    container_name: erp_assistant_postgres
    restart: "no"
    ports:
      - "${ERP_ASSISTANT_POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${ERP_ASSISTANT_POSTGRES_DB:-erp_assistant}
      POSTGRES_USER: ${ERP_ASSISTANT_POSTGRES_USER:-erp_assistant}
      POSTGRES_PASSWORD: ${ERP_ASSISTANT_POSTGRES_PASSWORD:?ERP_ASSISTANT_POSTGRES_PASSWORD is required}
    volumes:
      - erp_assistant_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - erp_assistant_local

volumes:
  erp_assistant_postgres_data:

networks:
  erp_assistant_local:
    driver: bridge
